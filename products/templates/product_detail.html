<!DOCTYPE html>
<html>
<head>
    <title>Detalle del producto</title>
</head>
<body>
    <h1>{{ productmodel.name }}</h1>

    <p><strong>Precio:</strong> ${{ productmodel.price }}</p>
    <p><strong>Descripción:</strong> {{ productmodel.description }}</p>
    <p><strong>Vendedor:</strong> {{ productmodel.seller }}</p>
    <p><strong>Color:</strong> {{ productmodel.color }}</p>
    <p><strong>Dimensiones:</strong> {{ productmodel.product_dimensions }}</p>

    <a href="{% url 'product_update' productmodel.pk %}">Editar</a>
    <a href="{% url 'product_delete' productmodel.pk %}">Eliminar</a>
    <br><br>
    <a href="{% url 'product_list' %}">Volver a la lista</a>
</body>
</html>
