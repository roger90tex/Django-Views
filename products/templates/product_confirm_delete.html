<!DOCTYPE html>
<html>
<head>
    <title>Eliminar producto</title>
</head>
<body>
    <h1>Eliminar producto</h1>

    <p>¿Estás seguro de que deseas eliminar "{{ productmodel.name }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <a href="{% url 'product_list' %}">Cancelar</a>
</body>
</html>
